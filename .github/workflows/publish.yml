name: NPM Publish

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Which package to release ("all" only releases packages changed since their last tag; picking one forces its release)'
        required: true
        type: choice
        default: 'all'
        options:
          - all
          - cddl
          - cddl2ts
          - cddl2java
          - cddl2py
          - cddl2swift
          - cddl2kotlin
      releaseType:
        description: "Release type - major, minor or patch"
        required: true
        type: choice
        default: 'patch'
        options:
          - patch
          - minor
          - major

# Static group (not github.ref): every dispatch releases main, so two dispatches from
# different branches must still serialize against each other, not run in parallel.
# Known limitation: GitHub only keeps one pending run per group. If a 3rd dispatch
# arrives while a 2nd is already queued behind a running 1st, the 2nd is silently
# cancelled before it runs any steps. Avoid triggering overlapping release dispatches.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Pinned like prepare/release-* below, so a dispatch from another branch can't skip testing main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 'main'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: 'pnpm'
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Validates compiling, typechecks, unit tests and CLI tests
        run: pnpm run checks:all

  prepare:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      # cddl is a workspace:* dependency of the rest, so it's split out and released first.
      releaseCddl: ${{ steps.set.outputs.releaseCddl }}
      dependents: ${{ steps.set.outputs.dependents }}
    steps:
      - name: Clone Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 'main'
          fetch-depth: 0
          fetch-tags: true
      - id: set
        # package=all: only release packages changed since their last tag (or untagged).
        # A specific package is an explicit choice, so it's always released.
        run: |
          if [ "${{ inputs.package }}" = "all" ]; then
            packages=()
            for name in cddl cddl2ts cddl2java cddl2py cddl2swift cddl2kotlin; do
              dir="packages/$name"
              last_tag=$(git tag -l "${name}-v*" --sort=-v:refname | head -n1)
              if [ -z "$last_tag" ]; then
                echo "$name: no previous release tag, including"
                packages+=("$name")
              # tsconfig.json is also in every package's release-it changelog/bump scope (.release-it.base.ts).
              elif ! git diff --quiet "$last_tag"..HEAD -- "$dir" tsconfig.json; then
                echo "$name: changes since $last_tag, including"
                packages+=("$name")
              else
                echo "$name: no changes since $last_tag, skipping"
              fi
            done
          else
            packages=("${{ inputs.package }}")
          fi

          releaseCddl=false
          dependents=()
          for name in "${packages[@]}"; do
            if [ "$name" = "cddl" ]; then
              releaseCddl=true
            else
              dependents+=("$name")
            fi
          done

          if [ ${#dependents[@]} -eq 0 ]; then
            dependents_json="[]"
          else
            dependents_json=$(printf '%s\n' "${dependents[@]}" | jq -R . | jq -sc .)
          fi
          echo "releaseCddl=$releaseCddl" >> "$GITHUB_OUTPUT"
          echo "dependents=$dependents_json" >> "$GITHUB_OUTPUT"

  release-cddl:
    needs: prepare
    if: ${{ needs.prepare.outputs.releaseCddl == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Clone Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 'main'
          fetch-depth: 0 # Required to fetch all tags for release-it
      - name: Setup PNPM
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node Version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: 'pnpm'
          registry-url: https://registry.npmjs.org/
      - name: Setup Git
        run: |
          git config --global user.email "bot@webdriver.io"
          git config --global user.name "WebdriverIO Release Bot"
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Package
        run: pnpm run build
        env:
          NODE_ENV: production
      - name: Release
        working-directory: packages/cddl
        run: pnpm run release:ci -- ${{ inputs.releaseType }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

  release-dependents:
    needs: [prepare, release-cddl]
    # Proceeds if release-cddl succeeded or was skipped (cddl not in this release), but not if it failed.
    if: ${{ !failure() && !cancelled() && needs.prepare.outputs.dependents != '[]' }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        package: ${{ fromJson(needs.prepare.outputs.dependents) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Clone Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 'main'
          fetch-depth: 0 # Required to fetch all tags for release-it
      - name: Setup PNPM
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node Version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: 'pnpm'
          registry-url: https://registry.npmjs.org/
      - name: Setup Git
        run: |
          git config --global user.email "bot@webdriver.io"
          git config --global user.name "WebdriverIO Release Bot"
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Package
        run: pnpm run build
        env:
          NODE_ENV: production
      - name: Release
        working-directory: packages/${{ matrix.package }}
        run: pnpm run release:ci -- ${{ inputs.releaseType }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
